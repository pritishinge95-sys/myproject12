<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">   <!-- ⭐ THIS FIXES EMOJIS -->

<title>Our Memories ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    width: 380px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

img {
    width: 100%;
    border-radius: 15px;
    max-height: 320px;
    object-fit: contain;
    background: #fff;
}


#caption {
    margin-top: 15px;
    font-size: 18px;
    color: #ff3366;
    font-weight: bold;
}

button {
    margin-top: 20px;
    padding: 10px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #ff3366;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #e62e5c;
}
</style>
</head>

<body>

<div class="card">
    <h2>Our Memories 📸❤️</h2>

    <!-- START FROM PIC2 -->
    <img id="photo" src="images/pic2.jpeg">

    <div id="caption">
        The day my heart chose you, BANDI ❤️
    </div>

    <button onclick="nextPhoto()">Next 💕</button>
</div>


<form action="gifts.php">
    <button type="submit" style="background:#ff7eb3; margin-top:10px;">
        ← See Another Gift 🎁
    </button>
</form>



<script>
let photos = [
    "images/pic2.jpeg",
    "images/pic3.jpeg",
    "images/pic4.jpeg",
    "images/pic5.jpeg",
    "images/pic6.jpeg",
    "images/pic7.jpeg",
    "images/pic8.jpeg"
];

let captions = [
    "The day my heart chose you, BANDI ❤️",
    "Your smile is my favorite place 😍",
    "Every moment with you feels special 💕",
    "I feel safest when I'm with you 🥹",
    "You make my world brighter ✨",
    "With you, everything feels right ❤️",
    "No matter what, I choose you, BANDI 💖"
];

let index = 0;

function nextPhoto() {
    index = (index + 1) % photos.length;
    document.getElementById("photo").src = photos[index];
    document.getElementById("caption").innerText = captions[index];
}
</script>

</body>
</html>
